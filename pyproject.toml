[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dtek_bot"
version = "0.1.0"
description = "Ukrainian Electricity Outage Tracker (DTEK) Telegram Bot & TMA"
authors = [{ name = "Artem Yaneia", email = "artem@yaneia.me" }]
maintainers = [{ name = "Artem Yaneia", email = "artem@yaneia.me" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.15.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.0.0",
    "pillow>=10.0.0",
    "curl_cffi>=0.7.0",
    "httpx>=0.27.0",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

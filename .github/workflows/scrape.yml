name: Scrape DTEK Outage Schedules

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "scrape-schedules"
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright (use pre-installed Chrome)
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --no-save playwright-core
            echo "PLAYWRIGHT_CHANNEL=chrome" >> "$GITHUB_ENV"
          else
            npm install --no-save playwright-core
            npx playwright install chromium --with-deps
          fi

      - name: Fetch DTEK schedules
        run: node scripts/fetch_schedules.mjs

      - name: Commit & push updated schedules
        run: |
          if [ -z "$(git status --porcelain schedules/)" ]; then
            echo "No schedule changes detected."
            exit 0
          fi
          git pull --rebase --autostash origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schedules/
          git commit -m "chore: update DTEK schedules"
          git push

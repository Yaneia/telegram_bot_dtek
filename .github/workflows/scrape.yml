name: Scrape DTEK Outage Schedules

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "scrape-schedules"
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright & Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps

      - name: Fetch DTEK schedules
        run: node scripts/fetch_schedules.mjs

      - name: Commit & push updated schedules
        run: |
          if [ -z "$(git status --porcelain schedules/)" ]; then
            echo "No schedule changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schedules/
          git commit -m "chore: update DTEK schedules"
          git push

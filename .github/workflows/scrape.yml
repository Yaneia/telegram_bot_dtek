name: Scrape DTEK Outage Schedules

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "scrape-schedules"
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache Playwright dependencies
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-pw-${{ hashFiles('.github/workflows/scrape.yml', 'scripts/fetch_schedules.mjs') }}
          restore-keys: |
            ${{ runner.os }}-pw-

      - name: Install Playwright (use pre-installed Chrome)
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            if [ ! -d "node_modules/playwright-core" ]; then
              PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --no-save playwright-core
            fi
            echo "PLAYWRIGHT_CHANNEL=chrome" >> "$GITHUB_ENV"
          else
            if [ ! -d "node_modules/playwright-core" ]; then
              npm install --no-save playwright-core
            fi
            if [ "${{ steps.pw-cache.outputs.cache-hit }}" != "true" ]; then
              npx playwright install chromium --with-deps
            fi
          fi

      - name: Fetch DTEK schedules
        run: node scripts/fetch_schedules.mjs

      - name: Commit & push updated schedules
        run: |
          if [ -z "$(git status --porcelain schedules/)" ]; then
            echo "No schedule changes detected."
            exit 0
          fi
          git pull --rebase --autostash origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schedules/
          git commit -m "chore: update DTEK schedules"
          git push
